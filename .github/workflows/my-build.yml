name: XY Chat bauen

on:
  workflow_dispatch:
  schedule:
    # Jeden Montag 04:17 UTC: aktuellen Element-X-Stand übernehmen und neu bauen
    - cron: '17 4 * * 1'

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Mit upstream (element-hq) abgleichen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream https://github.com/element-hq/element-x-android.git
          git fetch upstream develop
          # Nur lokal im Runner mergen (GITHUB_TOKEN darf keine geänderten Workflow-Dateien pushen)
          git merge --no-edit upstream/develop

      - name: Speicherplatz freimachen
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false
          tool-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen (F-Droid-Variante, Release)
        run: ./gradlew :app:assembleFdroidRelease --stacktrace --no-configuration-cache

      - name: Mit eigenem Schlüssel signieren
        env:
          KS_B64: ${{ secrets.XY_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.XY_KEYSTORE_PASSWORD }}
        run: |
          mkdir out
          APK=$(ls app/build/outputs/apk/fdroid/release/*-universal-release*.apk | head -1)
          if [ -z "$KS_B64" ]; then
            echo "::warning::Secrets XY_KEYSTORE_B64/XY_KEYSTORE_PASSWORD fehlen - APK bleibt mit dem öffentlichen Debug-Schlüssel signiert."
            cp "$APK" out/xy-chat.apk
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xy.keystore"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/xy.keystore" --ks-key-alias xychat \
            --ks-pass env:KS_PW --key-pass env:KS_PW --out out/xy-chat.apk "$APK"
          "$APKSIGNER" verify --print-certs out/xy-chat.apk | head -3
          rm "$RUNNER_TEMP/xy.keystore"

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="xy-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/xy-chat.apk \
            --title "XY Chat $TAG" \
            --notes "Gebaut aus element-hq/element-x-android @ $(git rev-parse --short upstream/develop)"
